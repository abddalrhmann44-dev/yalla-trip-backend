# Increased to 5G + G1GC because the previous 2G + SerialGC combo
# caused the daemon to native-OOM during R8 on release builds (the
# Wave 30 admin pages pushed the dexer over the edge).  G1 reclaims
# memory more aggressively and parallelises better than SerialGC,
# which matters when r8/d8 holds a large object graph.
org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
# R8 itself runs in the same daemon JVM, so giving it a higher
# heap budget prevents the OOM we saw at C2:54128 (R8 compile).
android.r8.maxMemoryUsage=4096
